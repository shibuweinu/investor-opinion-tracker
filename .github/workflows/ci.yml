name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install '.[dev,mcp]'
      - run: pytest --cov=opinion_tracker
      - run: ruff check .
      - run: mypy src/opinion_tracker
      - run: python -c "from opinion_tracker.mcp_server import build_server; build_server()"
