[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "investor-opinion-tracker"
version = "0.1.0"
description = "Authorized investor timeline collection and risk-aware market research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2.7", "typer>=0.12", "jinja2>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "PyYAML>=6", "types-PyYAML"]
mcp = ["mcp>=1.0"]
market = ["akshare>=1.14", "pandas>=2.2"]

[project.scripts]
opinion-tracker = "opinion_tracker.cli:app"
opinion-tracker-mcp = "opinion_tracker.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["opinion_tracker"]
